# ChatNoGPT —— chat.example.com（示例配置）
#
# 用法：
#   1. 把本文件放到服务器的 /etc/nginx/conf.d/chatnogpt.conf（名字自定）
#   2. 把 chat.example.com 换成你的域名；先注释掉下面 80 端口 server 里的 return 301 那行，再：
#        sudo certbot --nginx -d chat.example.com
#      certbot 签发证书后把 301 恢复（certbot 也可能已自动改好）
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 注意：map 块必须在 http 上下文中，conf.d 下的文件正好被 include 进 http。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    # 仅用于首次签发证书期间临时注释
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx >= 1.25.1；旧版本请改用: listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;   # ChatNoGPT 二进制监听地址
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接聊天：放宽读写超时
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
