<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatNoGPT</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatNoGPT">
<link rel="stylesheet" href="/style.css?v=2.5.2.10">
</head>
<body>

<!-- 登录 / 注册 -->
<div id="authView" class="auth-view hidden">
  <div class="auth-card">
    <div class="auth-logo">ChatNoGPT</div>
    <div class="auth-sub">你的个人 AI 助手</div>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" type="button">登录</button>
      <button id="tabRegister" type="button">注册</button>
    </div>
    <form id="loginForm" autocomplete="off">
      <input id="loginName" placeholder="模型名称" autocomplete="username" required>
      <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" required>
      <div class="form-error" id="loginError"></div>
      <button class="btn-primary" type="submit">继续</button>
    </form>
    <form id="registerForm" class="hidden" autocomplete="off">
      <div class="name-row">
        <input id="regName" placeholder="模型名称，如 gpt-6.1-sol" maxlength="30" required>
        <button id="btnRerollName" type="button" title="换一个名称">⟳</button>
      </div>
      <input id="regPassword" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required>
      <div class="form-error" id="regError"></div>
      <button class="btn-primary" type="submit">创建</button>
    </form>
  </div>
</div>

<!-- 主界面 -->
<div id="appView" class="app hidden">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">ChatNoGPT</div>
      <button id="btnNewConv" class="side-item" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>新建会话</span>
      </button>
      <button id="btnSearch" class="side-item" type="button" title="搜索消息（⌘P）">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>搜索消息</span>
        <kbd>⌘P</kbd>
      </button>
      <button id="btnPlugins" class="side-item" type="button" title="插件管理">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 3v4a1 1 0 0 1-2 0V3H8a2 2 0 0 0-2 2v3h1a2 2 0 1 1 0 4H6v3a2 2 0 0 0 2 2h3v-1a2 2 0 1 1 4 0v1h3a2 2 0 0 0 2-2v-3h-1a2 2 0 1 1 0-4h1V8a2 2 0 0 0-2-2h-3V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>插件</span>
      </button>
    </div>
    <nav id="convList"></nav>
    <div class="side-foot">
      <div class="user-chip">
        <span class="avatar" id="meAvatar">?</span>
        <span class="uname" id="meName">…</span>
        <button id="btnSettings" type="button" title="个人设置" aria-label="个人设置">⚙</button>
        <button id="btnLogout" type="button" title="退出登录">退出</button>
      </div>
    </div>
  </aside>
  <div class="side-mask" id="sideMask"></div>

  <main class="chat-main">
    <div class="chat-col">
    <header class="chat-head">
      <button class="icon-btn mobile-only" id="btnToggleSide" type="button">☰</button>
      <div class="chat-title" id="convTitle">ChatNoGPT</div>
      <button id="btnConvSearch" class="icon-btn" type="button" title="搜索当前会话" aria-label="搜索当前会话"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button id="btnGroupMembers" class="icon-btn hidden" type="button" title="群聊成员" aria-label="群聊成员">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3 19v-1a6 6 0 0 1 12 0v1M16 5.2a3 3 0 0 1 0 5.6M17 13a5 5 0 0 1 4 5v1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button id="btnRenameConv" class="icon-btn hidden" type="button" title="修改会话标题">✎</button>
      <button id="btnDrawer" class="icon-btn hidden" type="button" title="面板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M14.5 4v16" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </header>

    <div class="msg-scroll" id="msgScroll">
      <div class="msg-col" id="messages">
        <div class="welcome" id="welcome">
          <h1>ChatNoGPT</h1>
          <p>在下方选择一个模型，发送第一条消息。</p>
        </div>
      </div>
    </div>

    <section id="pluginPage" class="plugin-page hidden">
      <header class="pp-head">
        <button id="btnPluginBack" class="pp-back" type="button" title="返回聊天">←</button>
        <div>
          <h2>插件</h2>
          <p>扩展 ChatNoGPT 能力的功能模块，按账号独立启停。</p>
        </div>
      </header>
      <div class="pp-body" id="ppList"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div id="imagePreview" class="image-preview hidden"></div>
        <textarea id="input" rows="1" placeholder="询问任何问题"></textarea>
        <div class="composer-bar">
          <div class="bar-left">
            <button id="btnAttach" class="ghost-btn" type="button" title="添加图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <input id="imageInput" type="file" accept="image/*" class="hidden">
            <button id="btnSimGroup" class="access-btn" type="button" aria-expanded="false" title="选择分组">📁 选择分组 <span class="chev">▾</span></button>
            <button id="btnAccess" class="access-btn" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
              <span id="accessLabel">完全访问</span>
              <span class="chev">▾</span>
            </button>
            <button id="btnEffort" class="access-btn" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 21h6M10 18h4M12 3a6 6 0 0 0-3.2 11.1c.6.4 1.2 1.1 1.2 1.9h4c0-.8.6-1.5 1.2-1.9A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="effort-label">思考强度：</span><span id="effortModeLabel">关闭</span>
              <span class="chev">▾</span>
            </button>
          </div>
          <div class="bar-right">
            <button class="ring-btn" type="button" title="语音输入"><span class="ring"></span></button>
            <button id="modelBtn" class="model-btn" type="button" title="选择模型">
              <span class="m-name-label" id="modelLabel">选择模型</span>
              <span class="m-effort" id="effortLabel" style="display:none">最高</span>
              <span class="chev">▾</span>
            </button>
            <button id="btnSend" type="button" title="发送" disabled>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-hint">ChatNoGPT 也可能会犯错，请核查重要信息。</div>
      <div id="modelMenu" class="model-menu hidden"></div>
      <div id="accessMenu" class="model-menu access-menu hidden"></div>
      <div id="effortMenu" class="model-menu access-menu hidden"></div>
    </div>
    </div>
    <aside id="rightDrawer" class="right-drawer hidden">
      <header class="rd-head">
        <div class="rd-title" id="drawerTitle">面板</div>
        <button id="btnDrawerClose" class="icon-btn" type="button" title="收起面板">✕</button>
      </header>
      <div class="rd-body" id="drawerBody"></div>
    </aside>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<script src="/app.js?v=2.5.2.7"></script>
</body>
</html>
